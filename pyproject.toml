[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-moon-rental"
version = "0.1.0"
description = "Moon auctions, rentals and wallet-reconciled invoices for Alliance Auth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "allianceauth>=5.6,<6",
  "aa-moonmining>=3.2,<4",
  "requests>=2.32",
  "python-dateutil>=2.9",
]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9", "pytest-cov>=5", "ruff>=0.11", "build>=1.2", "aa-structures>=4.1,<5"]
structures = ["aa-structures>=4.1,<5"]
screenshots = ["playwright>=1.50"]

[tool.setuptools.packages.find]
include = ["moon_rental*"]

[tool.setuptools.package-data]
moon_rental = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["concurrency: requires a database with row-level locking"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["moon_rental"]
omit = ["*/migrations/*"]
