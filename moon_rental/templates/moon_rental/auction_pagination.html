{% load moon_rental %}
{% if lots.has_other_pages %}<nav class="mt-4 d-flex flex-wrap gap-2 align-items-center justify-content-between" aria-label="Auction moon pages"><span class="small text-body-secondary">Page {{ lots.number }} of {{ lots.paginator.num_pages }}</span><div class="btn-group">{% if lots.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% moon_query page=lots.previous_page_number %}">Previous</a>{% endif %}{% if lots.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% moon_query page=lots.next_page_number %}">Next</a>{% endif %}</div></nav>{% endif %}
