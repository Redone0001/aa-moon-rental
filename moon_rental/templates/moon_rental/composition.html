{% for product in moon.composition %}<div class="mb-2"><div class="d-flex justify-content-between small gap-3 mb-1"><span>{{ product.name }}</span><span class="mr-numeric text-body-secondary">{{ product.percent|floatformat:1 }}%</span></div><div class="progress mr-composition" role="progressbar" aria-label="{{ product.name }}" aria-valuenow="{{ product.percent }}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar bg-info" style="width:{{ product.percent|floatformat:2 }}%"></div></div></div>{% empty %}<p class="small text-body-secondary">No survey composition available.</p>{% endfor %}
