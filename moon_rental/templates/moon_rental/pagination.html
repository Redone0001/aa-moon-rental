{% load moon_rental %}{% if items.has_other_pages %}<nav class="mt-3 d-flex align-items-center justify-content-between" aria-label="Pagination"><span class="small text-body-secondary">Page {{ items.number }} of {{ items.paginator.num_pages }}</span><div class="btn-group">{% if items.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% moon_query page=items.previous_page_number %}">Previous</a>{% endif %}{% if items.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% moon_query page=items.next_page_number %}">Next</a>{% endif %}</div></nav>{% endif %}
